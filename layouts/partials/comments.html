{{/* ============================================================
     Giscus Comments — Tistory tt-list-reply inspired
     ============================================================ */}}

{{ with site.Params.giscus }}
<div class="comments-section">

  {{/* ── Header ── */}}
  <div class="comments-header">
    <span class="comments-title">
      <svg class="comments-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      댓글
    </span>
    <a href="https://github.com/{{ .repo }}/discussions" target="_blank" rel="noopener noreferrer"
       class="comments-github-link" title="GitHub Discussions에서 보기">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
           fill="currentColor" aria-hidden="true">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57
                 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695
                 -.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99
                 .105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225
                 -.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405
                 c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225
                 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3
                 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
      </svg>
    </a>
  </div>

  {{/* ── Giscus widget ── */}}
  <div class="comments-body" id="giscus-container">
    <script src="https://giscus.app/client.js"
      data-repo="{{ .repo }}"
      data-repo-id="{{ .repoId }}"
      data-category="{{ .category | default "General" }}"
      data-category-id="{{ .categoryId }}"
      data-mapping="pathname"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="top"
      data-theme="dark_dimmed"
      data-lang="ko"
      data-loading="lazy"
      crossorigin="anonymous"
      async>
    </script>
  </div>

</div>

<script>
(function () {
  /* ── Giscus 다크/라이트 테마 동기화 ── */
  function getTheme() {
    return document.documentElement.classList.contains('dark')
      ? 'dark_dimmed'
      : 'light';
  }

  function sendTheme(theme) {
    var iframe = document.querySelector('iframe.giscus-frame');
    if (!iframe) return;
    iframe.contentWindow.postMessage(
      { giscus: { setConfig: { theme: theme } } },
      'https://giscus.app'
    );
  }

  /* Giscus 로드 완료 후 초기 테마 동기화 */
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://giscus.app') return;
    if (e.data && e.data.giscus) {
      sendTheme(getTheme());
    }
  }, { once: true });

  /* 다크/라이트 모드 전환 시 동기화 */
  var observer = new MutationObserver(function (mutations) {
    mutations.forEach(function (m) {
      if (m.attributeName === 'class') {
        sendTheme(getTheme());
      }
    });
  });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
})();
</script>
{{ end }}
